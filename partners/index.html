{

let TOKEN='';try{const t=new URLSearchParams(location.search).get('t');if(t)localStorage.setItem('th_token',t);TOKEN=localStorage.getItem('th_token')||''}catch(e){}

 const res=await fetch(path,o);let j={};try{j=await res.json()}catch(e){}if(!res.ok)throw new Error(j.error||('HTTP '+res.status));return j}
async function act(path,body,ok){if(!API){toast((ok||'Done')+' (sample mode, nothing sent)');return null}try{return await api(path,body)}catch(e){toast(e.message,true);return null}}

/* ---------- Sample data shaped like the Partnership API ---------- */

let CAMP=[["Lot size calculator reel","TikTok",2400,.060,.45,.70],["Order blocks explained","TikTok",5200,.009,.30,.55],["Gold sessions cheat sheet","TikTok",1800,.040,.40,.65],["Trading journal walkthrough","YouTube",600,.053,.55,.80],["Free risk plan template","YouTube",450,.069,.50,.75],["Strategy carousel","Instagram",120,.008,.20,.5],["Trade Hour landing page","Website",900,.035,.38,.62]]
 .map(([name,platform,clicks,rr,fr,tr],i)=>{const reg=Math.round(clicks*rr),fund=Math.round(reg*fr),act=Math.round(fund*tr);return{id:"cmp_"+(4101+i),name,platform,clicks,reg,fund,act,reward:act*(8+r()*6),link:"https://one.exnesstrack.org/a/th208114?campaign="+(4101+i),created:"2026-"+(9+(i%3))+"-"+(10+i)}});
const COUNTRIES=["ZA","ZA","ZA","ZA","NG","KE","BW","GH","MY"],TYPES=["Standard","Standard","Pro","Raw Spread","Zero"];

let SUB=[["Kagiso M. (IB)",42,0.30],["Tumi Trades",18,0.25],["Durban FX Club",27,0.30],["Lerato K.",9,0.20]].map(([n,cl,sh],i)=>({id:"ral_"+(900+i),name:n,clients:cl,share:sh,lots:+(cl*(6+r()*9)).toFixed(1),reward:cl*(5+r()*8),link:P.link+"?ra="+(900+i)}));

let PAY=[...Array(8)].map((_,i)=>({date:`2026-11-${String(24-i*3).padStart(2,'0')}`,acc:pick(REB).acc,amount:+(4+r()*30).toFixed(2),status:i===0?"pending":"paid"}));
let TIERS=[{n:"Silver",clients:10,vol:100},{n:"Gold",clients:50,vol:500},{n:"Platinum",clients:150,vol:2000},{n:"Diamond",clients:400,vol:6000}];
let PERF=[310,420,515,690,880,1040].map((v,i)=>({m:["Jun","Jul","Aug","Sep","Oct","Nov"][i],reward:v+r()*80,lots:Math.round(v*0.9+r()*60),active:Math.round(v/11)}));
let BYDAY=[...Array(14)].map((_,i)=>({d:`11-${String(13+i).padStart(2,'0')}`,n:Math.round(10+i*1.3+r()*12)}));
CLAIMS=[{id:"demo1",name:"Thabo",email:"thabo@example.com",country:"South Africa",created:"2026-11-25T09:12",status:"waiting_signup"},{id:"demo2",name:"Amara",email:"amara@example.com",country:"Nigeria",created:"2026-11-24T18:40",status:"ready",affiliated:true,accounts:["51180412"]}];

let F={},FUNNEL_SAMPLE=false,WALLET={current_balance:"300.00",currency:"EXD",sample:true},REWARDS=[],MILESTONES=[{lots:1,exd:2},{lots:10,exd:5},{lots:50,exd:10},{lots:100,exd:20},{lots:250,exd:40}],SIGNUP_AMT='',SEL=new Set();
// T = real client numbers (overview, tiers). F = content funnel (Copilot), which may be labelled sample campaigns.
const totals=()=>{const byCl=CL.length>0;T={clicks:sum(CAMP,'clicks'),reg:byCl?CL.length:sum(CAMP,'reg'),fund:byCl?CL.filter(c=>c.stage!=="registered").length:sum(CAMP,'fund'),act:byCl?CL.filter(c=>c.stage==="trading").length:sum(CAMP,'act'),reward:sum(CAMP,'reward'),lots:sum(ACC,'lots')};
 F=sum(CAMP,'reg')>0?{clicks:sum(CAMP,'clicks'),reg:sum(CAMP,'reg'),fund:sum(CAMP,'fund'),act:sum(CAMP,'act')}:{...T}};

totals();REWARDS=sampleRewards();

 BRIEF=d.brief;BRIEF_SRC=d.brief_source;CLAIMS=d.claims||[];MODE=d.mode;SYNCED=d.synced;WARN=d.warnings||[];DRAFTS[0]=d.nudge||DRAFTS[0];
 FUNNEL_SAMPLE=!!d.funnel_sample;WALLET=d.exd_wallet||null;REWARDS=d.rewards||[];MILESTONES=d.milestones||MILESTONES;SIGNUP_AMT=d.signup_amount||'';totals();paintStatus()}

 const snap=MODE==='snapshot';$('#status').innerHTML=`<span class="dot ${API&&(live||snap)?'':'mock'}"></span>${API?(live?'Exness Partnership API · synced '+esc(t):snap?'Real data snapshot · '+esc((SYNCED||'').slice(5,10))+' '+esc(t)+' (Exness connector)':'Server on sample data · '+esc(t)):'Sample data (no server)'}`;
 $('#sync').hidden=!API;$('#pname').textContent=P.name;document.querySelectorAll('nav .ext,nav .sep-ext').forEach(x=>x.hidden=!API);

 const rates=st.slice(1).map((s,i)=>st[i][1]?s[1]/st[i][1]:1),worst=rates.indexOf(Math.min(...rates))+1;let o='';
 st.forEach(([n,v],i)=>{const w=Math.max(10,bw*Math.sqrt(v)/mx),x=lw+(bw-w)/2,y=i*rh+8,h=rh-26;o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--or)" opacity="${1-i*.18}"/><text x="0" y="${y+h/2-4}" font-size="13" fill="var(--mut)">${n}</text><text x="0" y="${y+h/2+15}" font-size="18" font-weight="700" font-family="Archivo" fill="var(--ink)">${fmt(v)}</text>`;
  if(i){const bad=i===worst;o+=`<text x="${narrow?W-2:W-rw+12}" y="${y-2}" font-size="13" font-weight="600" text-anchor="${narrow?'end':'start'}" fill="${bad?'var(--red)':'var(--bl)'}">${pct(v,st[i-1][1])}% ${bad?'⚠ biggest leak':'kept'}</text>`}});svg.innerHTML=o}
function ring(svg,p,label){const W=svg.clientWidth,H=svg.clientHeight,R=Math.min(W,H)/2-14,cx=W/2,cy=H/2,a=2*Math.PI*Math.min(p,.9999),x=cx+R*Math.sin(a),y=cy-R*Math.cos(a);

const busy=async(b,fn)=>{const t=b.textContent;b.disabled=true;b.textContent='Working…';try{await fn()}finally{if(b.isConnected){b.disabled=false;b.textContent=t}}};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.copy){copy(b.dataset.copy)}
 else if(b.dataset.f){V._f=b.dataset.f;show(true)}
 else if(b.id==='sync'){await busy(b,async()=>{try{load(await api('/api/sync',{}));show(true);toast('Synced')}catch(err){toast(err.message,true)}})}
 else if(b.id==='approve'){const text=$('#draft').value.trim();await busy(b,async()=>{const res=await act('/api/nudge/approve',{text,audience:'stalled'},'Approved');if(res||!API){approved=true;show(true);toast(res?(res.telegram?.ok?`Sent to your lessons channel · ${fmt(res.recipients)} stalled sign-ups`:`Approved and logged · ${res.telegram?.reason||'Telegram not sent'}`):`Queued: ${fmt(stalled().length)} people get this lesson`)}})}
 else if(b.id==='rewrite'){await busy(b,async()=>{if(API){const res=await act('/api/nudge/rewrite',{previous:$('#draft').value});if(res){DRAFTS.push(res.text);draftI=DRAFTS.length-1;toast(res.source==='claude'?'Rewritten by Claude':'Claude unavailable: next draft from the library')}}else draftI=(draftI+1)%DRAFTS.length;approved=false;show(true)})}
 else if(b.id==='sendBrief'){await busy(b,async()=>{const res=await act('/api/brief/send',{},'Brief sent');if(res)toast(res.telegram?.ok?'Brief sent to Telegram':'Not sent: '+(res.telegram?.reason||res.telegram?.description||'Telegram error'),!res.telegram?.ok)})}
 else if(b.id==='regen'){await busy(b,async()=>{if(!API)return toast('Sample mode');try{load(await api('/api/dashboard?refresh=1'));show(true);toast(BRIEF_SRC==='claude'?'New brief from Claude':'Brief regenerated (template: no Claude key)')}catch(err){toast(err.message,true)}})}
 else if(b.dataset.rf){V._rf=b.dataset.rf;show(true)}
 else if(b.dataset.selamt){SEL=new Set(REWARDS.filter(r=>r.status==='due'&&r.amount===+b.dataset.selamt).map(r=>r.id));show(true)}
 else if(b.id==='payLink'){const ids=[...SEL];await busy(b,async()=>{if(!API){const accs=REWARDS.filter(r=>SEL.has(r.id)).map(r=>r.accounts[0]).filter(Boolean),amt=REWARDS.find(r=>SEL.has(r.id)).amount;window.open(`https://my.exnessaffiliates.com/payments/exd-transfer?tab=myClients&defaultMode=byClientAccount&defaultRecipients=${accs.join(',')}&defaultAmount=${amt}`,'_blank','noopener');REWARDS.forEach(r=>{if(SEL.has(r.id))r.status='in_partner_area'});show(true);return}
  const w=window.open('about:blank','_blank');const res=await act('/api/exd/link',{ids});if(res){REWARDS=res.rewards;if(w){w.opener=null;w.location=res.url}else location.href=res.url;toast(`Partner Area opened with ${res.count} recipients. Mark paid when it's done.`);show(true)}else if(w)w.close()})}
 else if(b.id==='markPaid'){const ids=[...SEL];if(!b.dataset.armed){b.dataset.armed='1';b.textContent=`Confirm: ${ids.length} sent in Partner Area`;b.classList.remove('ghost');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Mark paid';b.classList.add('ghost')}},5000);return}
  await busy(b,async()=>{if(!API){REWARDS.forEach(r=>{if(SEL.has(r.id))r.status='paid'})}else{const res=await act('/api/exd/mark-paid',{ids});if(!res)return;REWARDS=res.rewards}SEL.clear();show(true);toast('Marked as sent. Clients see it in their dashboard.')})}
 else if(b.dataset.exd){const id=b.dataset.id,c=CLAIMS.find(x=>x.id===id);
  await busy(b,async()=>{if(!API){Object.assign(c,{status:'ready',affiliated:true,accounts:['51180999']});show(true);return toast('Sample mode, nothing checked')}
   const res=await act('/api/exd/check',{id});if(res){Object.assign(c,res.claim);REWARDS=res.rewards;show(true);toast(res.claim.affiliated?(res.reward?'Signed up through your link: sign-up reward added':'Signed up through your link'+(res.claim.note?' · '+res.claim.note:'')):'Not registered through your link yet')}})}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.sel){t.checked?SEL.add(t.dataset.sel):SEL.delete(t.dataset.sel);show(true);return}if(t.dataset.reb){const x=REB[t.dataset.reb],v=+t.value;const res=await act('/api/rebates',{account:x.acc,percent:v},`Rebate set to ${v}%`);if(res||!API){x.rebate=v;if(res)toast(`Rebate set to ${v}%, applies to next payout`)}else t.value=x.rebate}});
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='newCamp'){const n=$('#cName').value.trim(),plat=$('#cPlat').value;if(!n)return;
  if(API){const res=await act('/api/campaigns',{title:n,platform:plat});if(!res)return;CAMP.unshift(res.campaign)}
  else{const id=4101+CAMP.length;CAMP.unshift({id:'cmp_'+id,name:n,platform:plat,clicks:0,reg:0,fund:0,act:0,reward:0,link:P.link+'?campaign='+id,created:new Date().toISOString().slice(0,10)})}
  show(true);toast('Campaign created, link ready to copy')}
 if(e.target.id==='keyForm'){const res=await act('/api/settings',{tg_chat:$('#tg').value,tg_client_chat:$('#tgc').value},'Saved');if(res){STATUS.settings=res.settings;toast('Saved')}}});
show();
(async()=>{try{const [d,s]=await Promise.all([api('/api/dashboard'),api('/api/status')]);API=true;STATUS=s;load(d);show(true)}catch(e){paintStatus()}})();
}
</script>
</body></html>
